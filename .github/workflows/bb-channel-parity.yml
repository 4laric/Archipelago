# Bloodborne's half of the channel monitor. Mirrors er-channel-parity.yml, hour for hour, and
# shares its script (`.github/scripts/check_channels.py --game bb`) rather than copying it -- the
# drift between two copies of a check is exactly what the check is for.
#
# 🛑 THE `live` JOB ONLY MEANS ANYTHING ONCE /bb/ IS SERVING, which is rollout step 3 of
# docs/SPEC-peliarch-bloodborne.md (BB_REF pinned, bb-archipelago's site/ tree deployed). Until
# then it will fail against a 404, so it is gated on the BB_LIVE repository variable: set
# `BB_LIVE=1` in the repo's Actions variables when the deploy lands. The `unit` job runs from day
# one and is where the real regression risk is.
name: BB channel parity

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/check_channels.py"
      - ".github/workflows/bb-channel-parity.yml"
      - "deploy/docker/**"
      - "webgui/test_er_channels.py"
  pull_request:
    paths:
      - ".github/scripts/check_channels.py"
      - ".github/workflows/bb-channel-parity.yml"
      - "deploy/docker/**"
      - "webgui/test_er_channels.py"

permissions: {}

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: pytest -q webgui/test_er_channels.py
      - name: Accept Bloodborne beta tags, reject moving refs
        run: |
          deploy/docker/validate-ref.sh v0.1.0-beta.5 BB_REF
          deploy/docker/validate-ref.sh v0.1.0 BB_REF
          ! deploy/docker/validate-ref.sh main BB_REF
          ! deploy/docker/validate-ref.sh v0.1.0-beta BB_REF
      - name: Compose accepts an unset BB_REF and a pinned one
        working-directory: deploy/docker
        run: |
          cp .env.example .env
          ER_REF=v0.6.0.2 DOMAIN=example.test docker compose config --quiet
          ER_REF=v0.6.0.2 BB_REF=v0.1.0-beta.5 DOMAIN=example.test docker compose config --quiet

  live:
    if: >-
      vars.BB_LIVE == '1' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
       github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - run: python .github/scripts/check_channels.py --game bb --base-url https://peliarch.ca/
