# Peliarch self-host stack — `docker compose up -d` from this directory.
# Reads .env in this directory (copy .env.example → .env first).
name: ${COMPOSE_PROJECT_NAME:-peliarch}

services:
  web:
    build:
      context: ../..                 # repo root (needs MultiServer.py, webgui/, archipelago-go/)
      dockerfile: deploy/docker/Dockerfile
    env_file: .env
    environment:
      DATA_DIR: /data
      STORE_PATH: /data/rooms.json
      REPO_DIR: /app
    volumes:
      - peliarch_data:/data          # uploads, room saves, logs, rooms.json
    # port-per-room: expose the SAME range the orchestrator allocates (PORT_START..PORT_END)
    ports:
      - "${PORT_START:-38400}-${PORT_END:-38463}:${PORT_START:-38400}-${PORT_END:-38463}"
    expose:
      - "8080"                       # website, internal — Caddy proxies it
    restart: unless-stopped
    labels:
      - autoheal=true                # opt this container in to the autoheal watchdog
    # Detects the thread-exhaustion hang (see Dockerfile CMD). This check deliberately
    # consumes a worker thread — that IS the test: if every thread is parked on an SSE
    # stream the request never completes and the container is marked unhealthy.
    # `restart: unless-stopped` cannot catch this, because the process never exits.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=5)\" || exit 1"]
      interval: 60s
      timeout: 10s
      start_period: 90s              # image boots slowly: imports every world module
      retries: 3                     # ~3 min unresponsive before autoheal acts

  caddy:
    image: caddy:2
    depends_on: [web]
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped

  # Docker marks containers unhealthy but never acts on it; this watchdog does.
  # Scoped by label so it only ever touches `web`.
  # TRADEOFF: restarting web kills every running room subprocess with it, disconnecting
  # active players. With the 60s/3-retry settings above it only fires after ~3 minutes
  # of a fully unresponsive site — by which point the site is down for everyone anyway.
  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 30
      AUTOHEAL_START_PERIOD: 120
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  peliarch_data:
  caddy_data:
  caddy_config:
