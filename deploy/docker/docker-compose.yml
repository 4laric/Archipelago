# Peliarch self-host stack — `docker compose up -d` from this directory.
# Reads .env in this directory (copy .env.example → .env first).
name: ${COMPOSE_PROJECT_NAME:-peliarch}

services:
  web:
    build:
      context: ../..                 # repo root (needs MultiServer.py, webgui/, archipelago-go/)
      dockerfile: deploy/docker/Dockerfile
      args:
        # The Elden Ring tooling is cloned at this pin during the build -- see the Dockerfile's
        # `ertools` stage. Moving it is how you ship a new apworld/wizard: bump, rebuild, done.
        ER_REPO: ${ER_REPO:-https://github.com/4laric/er-archipelago.git}
        ER_REF: ${ER_REF:-main}
    env_file: .env
    environment:
      DATA_DIR: /data
      STORE_PATH: /data/rooms.json
      REPO_DIR: /app
      AP_ROOT: /app                  # the tree POST /generate runs Generate.py in
      ER_STATIC_DIR: /er-static      # what /er serves (wizard + check browser)
    volumes:
      - peliarch_data:/data          # uploads, room saves, logs, rooms.json
    # port-per-room: publish the SAME range the orchestrator allocates (PORT_START..PORT_END).
    #
    # 🛑 THE DEFAULTS HERE AND IN THE APP MUST AGREE, and until 2026-08-13 they did not: this said
    # 38463 while webgui/orchestrator.DEFAULT_PORT_END was 38600. With PORT_END set in .env they
    # agreed by accident; with it ABSENT the allocator would hand a room a port nobody could reach,
    # and the room would look perfectly healthy from the inside -- listening, `alive: true`, and
    # unreachable. Aligned to 38400-38599 (== range(38400, 38600), which is what the allocator
    # walks) and asserted by webgui/test_limits.py so they cannot drift again.
    #
    # 🛑 THE RANGE IS NOT FREE, AND THE COST IS PER PORT, NOT PER ROOM. With Docker's default
    # userland proxy, every published port gets its own `docker-proxy` process whether or not a
    # room is using it -- a few MB each, resident from `up` onward. Count them before widening:
    #     ps -o rss= -C docker-proxy | awk '{s+=$1} END {print NR" procs, "s/1024" MB"}'
    # If that is a number you mind, set `"userland-proxy": false` in /etc/docker/daemon.json and
    # restart the daemon: forwarding falls back to iptables DNAT, which costs nothing per port.
    # Do that BEFORE widening the range, not after.
    #
    # 🛑 A PORT IS NOW HELD FOR THE LIFE OF A ROOM, not just while it runs (the sticky-port fix
    # that made connect addresses safe). So this range caps rooms that EXIST, not rooms running at
    # once: 200 ports is 200 rooms ever, until finished rooms are deleted. _pick_free_port says so
    # in its error rather than failing obscurely.
    ports:
      - "${PORT_START:-38400}-${PORT_END:-38599}:${PORT_START:-38400}-${PORT_END:-38599}"
    expose:
      - "8080"                       # website, internal — Caddy proxies it
    restart: unless-stopped
    labels:
      - autoheal=true                # opt this container in to the autoheal watchdog
    # Detects the thread-exhaustion hang (see Dockerfile CMD). This check deliberately
    # consumes a worker thread — that IS the test: if every thread is parked on an SSE
    # stream the request never completes and the container is marked unhealthy.
    # `restart: unless-stopped` cannot catch this, because the process never exits.
    healthcheck:
      # 🛑 NOT `/`. urlopen RAISES on any non-2xx, and `/` answers 503 by design on a box with no
      # landing.html in ER_STATIC_DIR -- so pointed at `/` this check fails forever on an
      # undeployed box, autoheal restarts the container, and every restart kills the running rooms
      # with it. A liveness probe must not be able to fail for a content reason. /hosting is one of
      # peliarch's own routes, always 200, and consumes a worker thread exactly the same way --
      # which IS the test, per the note above.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/hosting', timeout=5)\" || exit 1"]
      interval: 60s
      timeout: 10s
      start_period: 90s              # image boots slowly: imports every world module
      retries: 3                     # ~3 min unresponsive before autoheal acts

  caddy:
    # NOT `image: caddy:2`. Rate limiting is not in stock Caddy -- it needs
    # github.com/mholt/caddy-ratelimit compiled in, which means an xcaddy build.
    # See deploy/docker/Caddyfile.Dockerfile for what that pulls in and the trade-off.
    build:
      context: .
      dockerfile: Caddyfile.Dockerfile
    depends_on: [web]
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
      GENERATE_RATE_EVENTS: ${GENERATE_RATE_EVENTS:-3}
      GENERATE_RATE_WINDOW: ${GENERATE_RATE_WINDOW:-1m}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped

  # Docker marks containers unhealthy but never acts on it; this watchdog does.
  # Scoped by label so it only ever touches `web`.
  # TRADEOFF: restarting web kills every running room subprocess with it, disconnecting
  # active players. With the 60s/3-retry settings above it only fires after ~3 minutes
  # of a fully unresponsive site — by which point the site is down for everyone anyway.
  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 30
      AUTOHEAL_START_PERIOD: 120
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  peliarch_data:
  caddy_data:
  caddy_config:
